services:
  app:
    build: .
    container_name: maintenance-app
    ports:
      - "3030:3000"
    volumes:
      # Bind mount for database persistence (moves db out of prisma folder to avoid hiding schema)
      - ./data:/app/data
      # Bind mount for user-uploaded files
      - ./public/uploads:/app/public/uploads
    environment:
      - DATABASE_URL=file:/app/data/dev.db
      # Required. Put AUTH_SECRET=<output of: openssl rand -base64 32> in a .env file next to this file.
      - AUTH_SECRET=${AUTH_SECRET:?Set AUTH_SECRET in .env (generate with: openssl rand -base64 32)}
      - AUTH_TRUST_HOST=true
      - AUTH_URL=https://maint.example.com
    restart: always
